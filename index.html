<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छत्रपती संभाजीनगर बस लाईव्ह</title>
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --primary: #1d4ed8;       /* प्रोफेशनल गडद निळा */
            --primary-hover: #1e40af;
            --accent: #16a34a;        /* स्पष्ट हिरवा रंग */
            --border: #cbd5e1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* वरची पट्टी (Header) */
        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* बटणे */
        .btn {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            background: white;
            color: var(--primary);
        }

        .lang-select select {
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            background: white;
            color: var(--primary);
            cursor: pointer;
        }

        .main-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 12px;
        }

        /* कार्ड डिझाइन */
        .search-card, .result-card, .timetable-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 15px;
            color: var(--text-main);
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            background: #fff;
            color: #000;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .gps-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            cursor: pointer;
            font-size: 20px;
        }

        /* सजेशन्स लिस्ट (सोपी आणि मोठी) */
        .suggestions-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            z-index: 9999;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 14px 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        .suggestion-item:hover {
            background-color: #eff6ff;
            color: var(--primary);
        }

        /* शोधण्याचे मुख्य बटण */
        .search-submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
        }
        .search-submit-btn:active { transform: scale(0.98); }

        #map {
            height: 280px;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            display: none;
        }

        .result-card, .timetable-card { display: none; }
        
        .bus-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .bus-route {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* टाईमलाईन */
        .timeline {
            position: relative;
            margin-left: 10px;
            padding-left: 20px;
            border-left: 3px solid var(--accent);
        }

        .stop-item {
            position: relative;
            margin-bottom: 20px;
        }

        .stop-item::before {
            content: '';
            position: absolute;
            left: -27.5px;
            top: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--accent);
        }

        .stop-item.current::before { 
            background: var(--accent); 
            box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.2);
        }

        .stop-name { font-weight: 700; font-size: 15px; }
        .stop-time { font-size: 13px; color: var(--text-sub); margin-top: 2px; }

        .current-badge {
            background-color: #ea580c;
            color: white;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 700;
            display: inline-block;
        }

        .timetable-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .timetable-table th, .timetable-table td {
            border: 1px solid var(--border);
            padding: 10px 8px;
            text-align: center;
            font-size: 13px;
        }

        .timetable-table th {
            background-color: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚍 संभाजीनगर बस लाईव्ह</h1>
        <div class="header-controls">
            <button class="btn" onclick="toggleTimetable()" id="timetableBtnText">📅 वेळापत्रक</button>
            <div class="lang-select">
                <select id="languageSelect" onchange="changeLanguage()">
                    <option value="mr">मराठी</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </div>

    <div class="main-container">

        <!-- वेळापत्रक कार्ड -->
        <div class="timetable-card" id="timetableCard">
            <h3 id="ttHeader" style="color: var(--primary); margin-top: 0; font-size: 16px;">संपूर्ण बस वेळापत्रक</h3>
            <table class="timetable-table">
                <thead>
                    <tr>
                        <th id="thBus">बस</th>
                        <th id="thRoute">मार्ग</th>
                        <th id="thTime">वेळ</th>
                    </tr>
                </thead>
                <tbody id="timetableBody"></tbody>
            </table>
        </div>

        <!-- शोध बॉक्स -->
        <div class="search-card">
            <div class="input-group">
                <label id="lblSource" for="sourceInput">📍 कुठून निघायचे आहे? (कुठून)</label>
                <div class="input-wrapper">
                    <input type="text" id="sourceInput" placeholder="उदा. सिडको किंवा CIDCO टाईप करा" oninput="filterSuggestions('sourceInput', 'sourceSuggestions')" autocomplete="off">
                    <button class="gps-btn" onclick="getCurrentLocation()" title="माझे लोकेशन">📍</button>
                </div>
                <div id="sourceSuggestions" class="suggestions-list"></div>
            </div>
            
            <div class="input-group">
                <label id="lblDest" for="destInput">🏁 कुठे जायचे आहे? (कुठे)</label>
                <div class="input-wrapper">
                    <input type="text" id="destInput" placeholder="उदा. क्रांती चौक किंवा Kranti Chowk" oninput="filterSuggestions('destInput', 'destSuggestions')" autocomplete="off">
                </div>
                <div id="destSuggestions" class="suggestions-list"></div>
            </div>

            <button class="search-submit-btn" id="searchBtnText" onclick="findBusRoute()">बस शोधा (Search)</button>
        </div>

        <!-- मॅप -->
        <div id="map"></div>

        <!-- निकाल आणि माहिती -->
        <div class="result-card" id="resultCard">
            <div class="bus-title" id="busNameTitle"></div>
            <div class="bus-route" id="busRouteSub"></div>
            <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 16px;">
            <h4 id="timelineHeader" style="margin-top: 0; font-size: 15px; color: var(--text-sub);">बसचे स्टॉप्स:</h4>
            <div class="timeline" id="timelineBox"></div>
        </div>

    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const routesData = [
            {
                source: "सिडको", sourceEn: "CIDCO",
                destination: "क्रांती चौक", destinationEn: "Kranti Chowk",
                busName: "बस १०१ - सिडको एक्स्प्रेस",
                routeText: "सिडको ➔ मोंढा नाका ➔ क्रांती चौक",
                departureTimes: "०८:०० वा., १०:०० वा., १२:३० वा.",
                lat: 19.8762, lng: 75.3433,
                stops: [
                    { name: "सिडको (CIDCO)", time: "१०:०० वाजता", status: "passed" },
                    { name: "मोंढा नाका (Mondha Naka)", time: "१०:१० वाजता", status: "current" },
                    { name: "क्रांती चौक (Kranti Chowk)", time: "१०:२० वाजता", status: "upcoming" }
                ]
            },
            {
                source: "मध्यवर्ती बस स्टँड", sourceEn: "Central Bus Stand",
                destination: "रेल्वे स्टेशन", destinationEn: "Railway Station",
                busName: "बस १०२ - रेल्वे स्पेशल",
                routeText: "मध्यवर्ती बस स्टँड ➔ अदालत रोड ➔ रेल्वे स्टेशन",
                departureTimes: "०९:१५ वा., ११:४५ वा., ०३:१५ वा.",
                lat: 19.8850, lng: 75.3250,
                stops: [
                    { name: "मध्यवर्ती बस स्टँड (CBS)", time: "०९:१५ वाजता", status: "passed" },
                    { name: "अदालत रोड (Adalat Road)", time: "०९:२५ वाजता", status: "current" },
                    { name: "रेल्वे स्टेशन (Railway Station)", time: "०९:३५ वाजता", status: "upcoming" }
                ]
            },
            {
                source: "सिडको एन-१", sourceEn: "CIDCO N-1",
                destination: "सिंहासन चौक", destinationEn: "Sinhasan Chowk",
                busName: "बस १०३ - एन-१ स्पेशल",
                routeText: "सिडको एन-१ ➔ सिडको एन-५ ➔ सिंहासन चौक",
                departureTimes: "०८:३० वा., ११:०० वा.",
                lat: 19.8650, lng: 75.3550,
                stops: [
                    { name: "सिडको एन-१ (CIDCO N-1)", time: "०८:३० वाजता", status: "passed" },
                    { name: "सिडको एन-५ (CIDCO N-5)", time: "०८:४० वाजता", status: "current" },
                    { name: "सिंहासन चौक (Sinhasan Chowk)", time: "०८:५० वाजता", status: "upcoming" }
                ]
            }
        ];

        const sambhajinagarStops = [
            "सिडको (CIDCO)", "CIDCO", "सिडको एन-१ (CIDCO N-1)", "सिडको एन-२", "सिडको एन-३", "सिडको एन-४", "सिडको एन-५",
            "क्रांती चौक (Kranti Chowk)", "Kranti Chowk",
            "मोंढा नाका (Mondha Naka)", "Mondha Naka",
            "मध्यवर्ती बस स्टँड (CBS)", "Central Bus Stand", "CBS",
            "रेल्वे स्टेशन (Railway Station)", "Railway Station",
            "अदालत रोड (Adalat Road)", "Adalat Road",
            "जळगाव रोड (Jalna Road)", "Jalna Road",
            "बाबा पेट्रोल पंप (Baba Petrol Pump)", "Baba Petrol Pump",
            "हर्सूल टी पॉइंट (Harsul T Point)", "Harsul T Point",
            "दिल्ली गेट (Delhi Gate)", "Delhi Gate",
            "सिंहासन चौक (Sinhasan Chowk)", "Sinhasan Chowk"
        ];

        const translations = {
            mr: {
                lblSource: "📍 कुठून निघायचे आहे? (कुठून)",
                lblDest: "🏁 कुठे जायचे आहे? (कुठे)",
                searchBtnText: "बस शोधा (Search)",
                timelineHeader: "बसचे स्टॉप्स:",
                timetableBtn: "📅 वेळापत्रक",
                ttHeader: "संपूर्ण बस वेळापत्रक",
                thBus: "बस", thRoute: "मार्ग", thTime: "वेळ",
                notFound: "माफ करा! या मार्गावर बस सापडली नाही. (उदा. 'सिडको' ते 'क्रांती चौक' निवडा)"
            },
            en: {
                lblSource: "📍 From (Starting Point)",
                lblDest: "🏁 To (Destination)",
                searchBtnText: "Search Bus",
                timelineHeader: "Bus Stops:",
                timetableBtn: "📅 Timetable",
                ttHeader: "Full Bus Timetable",
                thBus: "Bus", thRoute: "Route", thTime: "Time",
                notFound: "No bus found for this route! (Try 'CIDCO' to 'Kranti Chowk')"
            }
        };

        // Firebase कॉन्फिग जोडून डेटाबेस सुरू करणे
        const firebaseConfig = {
            databaseURL: "https://sambhajinagar-live-bus-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function changeLanguage() {
            let lang = document.getElementById('languageSelect').value;
            document.getElementById('lblSource').innerText = translations[lang].lblSource;
            document.getElementById('lblDest').innerText = translations[lang].lblDest;
            document.getElementById('searchBtnText').innerText = translations[lang].searchBtnText;
            document.getElementById('timelineHeader').innerText = translations[lang].timelineHeader;
            document.getElementById('timetableBtnText').innerText = translations[lang].timetableBtn;
            document.getElementById('ttHeader').innerText = translations[lang].ttHeader;
            document.getElementById('thBus').innerText = translations[lang].thBus;
            document.getElementById('thRoute').innerText = translations[lang].thRoute;
            document.getElementById('thTime').innerText = translations[lang].thTime;
        }

        function loadTimetable() {
            let tbody = document.getElementById('timetableBody');
            tbody.innerHTML = "";
            routesData.forEach(route => {
                tbody.innerHTML += `<tr><td><b>${route.busName}</b></td><td>${route.routeText}</td><td>${route.departureTimes}</td></tr>`;
            });
        }
        loadTimetable();

        function toggleTimetable() {
            let ttCard = document.getElementById('timetableCard');
            ttCard.style.display = (ttCard.style.display === "block") ? "none" : "block";
        }

        function getCurrentLocation() {
            document.getElementById('sourceInput').value = "सिडको (CIDCO)";
            alert("लोकेशन सेट झाले: सिडको (CIDCO)");
        }

        function filterSuggestions(inputId, listId) {
            let inputVal = document.getElementById(inputId).value.trim().toLowerCase();
            let listDiv = document.getElementById(listId);
            listDiv.innerHTML = "";

            if (inputVal === "") return;

            let matches = sambhajinagarStops.filter(stop => stop.toLowerCase().includes(inputVal));

            matches.forEach(stop => {
                let item = document.createElement('div');
                item.className = 'suggestion-item';
                item.innerText = stop;
                
                item.onclick = function() {
                    document.getElementById(inputId).value = stop;
                    setTimeout(() => {
                        listDiv.innerHTML = "";
                    }, 100);
                };
                listDiv.appendChild(item);
            });
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.input-group')) {
                document.querySelectorAll('.suggestions-list').forEach(el => el.innerHTML = "");
            }
        });

        var map, busMarker;

        function findBusRoute() {
            let sourceVal = document.getElementById('sourceInput').value.trim().toLowerCase();
            let destVal = document.getElementById('destInput').value.trim().toLowerCase();
            let resultCard = document.getElementById('resultCard');
            let mapDiv = document.getElementById('map');
            let lang = document.getElementById('languageSelect').value;

            document.querySelectorAll('.suggestions-list').forEach(el => el.innerHTML = "");
            document.getElementById('timetableCard').style.display = "none";

            let matchedBus = routesData.find(r => 
                (r.source.toLowerCase().includes(sourceVal) || r.sourceEn.toLowerCase().includes(sourceVal)) && 
                (r.destination.toLowerCase().includes(destVal) || r.destinationEn.toLowerCase().includes(destVal))
            );

            if (matchedBus) {
                resultCard.style.display = "block";
                mapDiv.style.display = "block";

                document.getElementById('busNameTitle').innerText = matchedBus.busName;
                document.getElementById('busRouteSub').innerText = "मार्ग: " + matchedBus.routeText;

                let timelineHTML = "";
                matchedBus.stops.forEach(stop => {
                    let badge = (stop.status === "current") ? `<span class="current-badge">सध्या बस इथे आहे 📍</span>` : "";
                    timelineHTML += `
                        <div class="stop-item ${stop.status}">
                            <div class="stop-name">${stop.name} ${badge}</div>
                            <div class="stop-time">${stop.time}</div>
                        </div>
                    `;
                });
                document.getElementById('timelineBox').innerHTML = timelineHTML;

                let sambhajinagarBounds = [
                    [19.8000, 75.2500], 
                    [19.9500, 75.4500]  
                ];

                if (!map) {
                    map = L.map('map', {
                        maxBounds: sambhajinagarBounds,
                        maxBoundsViscosity: 1.0,
                        minZoom: 12,
                        maxZoom: 17
                    }).setView([matchedBus.lat, matchedBus.lng], 14);

                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    busMarker = L.marker([matchedBus.lat, matchedBus.lng]).addTo(map)
                        .bindPopup(`<b>${matchedBus.busName}</b><br>छत्रपती संभाजीनगर`).openPopup();
                } else {
                    map.setView([matchedBus.lat, matchedBus.lng], 14);
                    busMarker.setLatLng([matchedBus.lat, matchedBus.lng])
                             .setPopupContent(`<b>${matchedBus.busName}</b><br>छत्रपती संभाजीनगर`).openPopup();
                }
                setTimeout(() => { map.invalidateSize(); }, 200);

                // Firebase कडून बसचे लाईव्ह लोकेशन सतत ऐकणे (Live Listener)
                db.ref('buses/bus_101').on('value', (snapshot) => {
                    let liveData = snapshot.val();
                    if (liveData && map && busMarker) {
                        let newLat = liveData.lat;
                        let newLng = liveData.lng;
                        
                        // नकाशावर बसचे मार्कर लाईव्ह हलवणे
                        busMarker.setLatLng([newLat, newLng]);
                        map.panTo([newLat, newLng]);
                    }
                });

            } else {
                alert(translations[lang].notFound);
                resultCard.style.display = "none";
                mapDiv.style.display = "none";
            }
        }
    </script>
</body>
</html>
