<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">छत्रपती संभाजीनगर बस लाईव्ह</title>
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --primary: #1d4ed8;
            --accent: #16a34a;
            --border: #cbd5e1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .header-btn, .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            background: white;
            color: var(--primary);
        }

        .main-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 12px;
            padding-bottom: 40px;
        }

        .search-card, .result-card, .timetable-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .timetable-card { display: none; }

        .input-group {
            margin-bottom: 12px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fff;
            box-sizing: border-box;
        }

        .gps-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            font-size: 18px;
        }

        .suggestions-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            z-index: 9999;
            max-height: 180px;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 12px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
        }

        .suggestion-item:hover {
            background-color: #eff6ff;
            color: var(--primary);
        }

        .search-submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
        }

        #map {
            height: 350px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .bus-emoji-icon {
            font-size: 30px;
            background: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid var(--primary);
        }

        .user-dot {
            background: #2563eb;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }

        .result-card { display: none; }
        
        .bus-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .bus-route {
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .eta-info {
            background: #eff6ff;
            color: #1e40af;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            border: 1px solid #bfdbfe;
        }

        .crowd-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .crowd-low { background: #dcfce7; color: #166534; }
        .crowd-medium { background: #fef9c3; color: #854d0e; }
        .crowd-high { background: #fee2e2; color: #991b1b; }

        .timeline {
            position: relative;
            margin-left: 10px;
            padding-left: 18px;
            border-left: 3px solid var(--accent);
        }

        .stop-item {
            position: relative;
            margin-bottom: 16px;
        }

        .stop-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--accent);
        }

        .stop-item.current::before { 
            background: var(--accent); 
        }

        .stop-name { font-weight: 700; font-size: 14px; }
        .stop-time { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

        .current-badge {
            background-color: #ea580c;
            color: white;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: 700;
            display: inline-block;
        }

        .timetable-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .timetable-table th, .timetable-table td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
            font-size: 12px;
        }

        .timetable-table th {
            background-color: var(--primary);
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="appTitle">🚍 संभाजीनगर बस लाईव्ह</h1>
        <div class="header-controls">
            <select id="langSelect" class="lang-select" onchange="changeLanguage()">
                <option value="mr">मराठी</option>
                <option value="en">English</option>
            </select>
            <button class="header-btn" id="timetableBtn" onclick="toggleTimetable()">📅 वेळापत्रक</button>
        </div>
    </div>

    <div class="main-container">

        <!-- वेळापत्रक कार्ड -->
        <div class="timetable-card" id="timetableCard">
            <h3 id="ttHeading" style="color: var(--primary); margin-top: 0; font-size: 15px;">संपूर्ण बस वेळापत्रक</h3>
            <table class="timetable-table">
                <thead>
                    <tr>
                        <th id="thBus">बस</th>
                        <th id="thRoute">मार्ग</th>
                        <th id="thTime">वेळ</th>
                    </tr>
                </thead>
                <tbody id="timetableBody"></tbody>
            </table>
        </div>

        <!-- एकदम सोपा एकच सर्च बॉक्स -->
        <div class="search-card">
            <div class="input-group">
                <label for="singleStopInput" id="labelStopInput">📍 बस स्टॉपचे नाव किंवा बस नंबर टाका:</label>
                <div class="input-wrapper">
                    <input type="text" id="singleStopInput" placeholder="उदा. अदालत रोड किंवा 102" oninput="filterSuggestions()" autocomplete="off">
                    <button class="gps-btn" onclick="useCurrentLocation()" title="माझे लोकेशन">📍</button>
                </div>
                <div id="stopSuggestions" class="suggestions-list"></div>
            </div>

            <button class="search-submit-btn" id="searchBusBtn" onclick="findBus()">बस शोधा</button>
        </div>

        <!-- नकाशा -->
        <div id="map"></div>

        <!-- निकाल आणि माहिती -->
        <div class="result-card" id="resultCard">
            <div class="bus-title" id="busNameTitle"></div>
            <div class="bus-route" id="busRouteSub"></div>
            <div class="eta-info" id="etaBox">⏳ अंतर आणि वेळ मोजत आहे...</div>
            <div id="crowdStatusBox"></div>
            <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 12px;">
            <h4 id="stopsHeading" style="margin-top: 0; font-size: 14px; color: var(--text-sub);">बसचे स्टॉप्स:</h4>
            <div class="timeline" id="timelineBox"></div>
        </div>

    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const translations = {
            mr: {
                appTitle: "🚍 संभाजीनगर बस लाईव्ह",
                timetableBtn: "📅 वेळापत्रक",
                ttHeading: "संपूर्ण बस वेळापत्रक",
                thBus: "बस", thRoute: "मार्ग", thTime: "वेळ",
                labelStop: "📍 बस स्टॉपचे नाव किंवा बस नंबर टाका:",
                placeholderStop: "उदा. अदालत रोड किंवा 102",
                searchBtn: "बस शोधा",
                stopsHeading: "बसचे स्टॉप्स:"
            },
            en: {
                appTitle: "🚍 Sambhajinagar Bus Live",
                timetableBtn: "📅 Timetable",
                ttHeading: "Complete Bus Timetable",
                thBus: "Bus", thRoute: "Route", thTime: "Time",
                labelStop: "📍 Enter Bus Stop Name or Bus No:",
                placeholderStop: "e.g. Adalat Road or 102",
                searchBtn: "Search Bus",
                stopsHeading: "Bus Stops:"
            }
        };

        let currentLang = "mr";

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            let t = translations[currentLang];

            document.getElementById('appTitle').innerText = t.appTitle;
            document.getElementById('timetableBtn').innerText = t.timetableBtn;
            document.getElementById('ttHeading').innerText = t.ttHeading;
            document.getElementById('thBus').innerText = t.thBus;
            document.getElementById('thRoute').innerText = t.thRoute;
            document.getElementById('thTime').innerText = t.thTime;
            document.getElementById('labelStopInput').innerText = t.labelStop;
            document.getElementById('singleStopInput').placeholder = t.placeholderStop;
            document.getElementById('searchBusBtn').innerText = t.searchBtn;
            document.getElementById('stopsHeading').innerText = t.stopsHeading;

            loadTimetable();
        }

        const routesData = [
            {
                id: "101",
                busName: { mr: "बस १०१ - सिडको एक्स्प्रेस", en: "Bus 101 - CIDCO Express" },
                routeText: { mr: "सिडको ➔ मोंढा नाका ➔ क्रांती चौक", en: "CIDCO ➔ Mondha Naka ➔ Kranti Chowk" },
                departureTimes: "०८:०० वा., १०:०० वा.",
                crowd: "medium", crowdText: "मध्यम गर्दी (Medium Crowd)",
                lat: 19.8762, lng: 75.3433,
                stops: [
                    { name: { mr: "सिडको (CIDCO)", en: "CIDCO" }, time: "१०:०० AM", status: "passed" },
                    { name: { mr: "मोंढा नाका (Mondha Naka)", en: "Mondha Naka" }, time: "१०:१० AM", status: "current" },
                    { name: { mr: "क्रांती चौक (Kranti Chowk)", en: "Kranti Chowk" }, time: "१०:२० AM", status: "upcoming" }
                ]
            },
            {
                id: "102",
                busName: { mr: "बस १०२ - रेल्वे स्पेशल", en: "Bus 102 - Railway Special" },
                routeText: { mr: "मध्यवर्ती बस स्टँड ➔ अदालत रोड ➔ रेल्वे स्टेशन", en: "CBS ➔ Adalat Road ➔ Railway Station" },
                departureTimes: "०९:१५ वा., ११:४५ वा.",
                crowd: "low", crowdText: "मोकळी बस (Low Crowd)",
                lat: 19.8850, lng: 75.3250,
                stops: [
                    { name: { mr: "मध्यवर्ती बस स्टँड (CBS)", en: "CBS" }, time: "०९:१५ AM", status: "passed" },
                    { name: { mr: "अदालत रोड (Adalat Road)", en: "Adalat Road" }, time: "०९:२५ AM", status: "current" },
                    { name: { mr: "रेल्वे स्टेशन (Railway Station)", en: "Railway Station" }, time: "०९:३५ AM", status: "upcoming" }
                ]
            },
            {
                id: "103",
                busName: { mr: "बस १०३ - एन-१ स्पेशल", en: "Bus 103 - N-1 Special" },
                routeText: { mr: "सिडको एन-१ ➔ सिडको एन-५ ➔ सिंहासन चौक", en: "CIDCO N-1 ➔ CIDCO N-5 ➔ Sinhasan Chowk" },
                departureTimes: "०८:३० वा., ११:०० वा.",
                crowd: "high", crowdText: "पूर्ण गर्दी / फुल (High Crowd)",
                lat: 19.8650, lng: 75.3550,
                stops: [
                    { name: { mr: "सिडको एन-१ (CIDCO N-1)", en: "CIDCO N-1" }, time: "०८:३० AM", status: "passed" },
                    { name: { mr: "सिडको एन-५ (CIDCO N-5)", en: "CIDCO N-5" }, time: "०८:४० AM", status: "current" },
                    { name: { mr: "सिंहासन चौक (Sinhasan Chowk)", en: "Sinhasan Chowk" }, time: "०८:५० AM", status: "upcoming" }
                ]
            }
        ];

        const sambhajinagarStops = [
            "सिडको (CIDCO)", "सिडको एन-१", "क्रांती चौक",
            "मोंढा नाका", "मध्यवर्ती बस स्टँड (CBS)",
            "रेल्वे स्टेशन (Railway Station)", "अदालत रोड", "101", "102", "103"
        ];

        const firebaseConfig = {
            databaseURL: "https://sambhajinagar-live-bus-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userLatLng = null;
        let userMarker = null;

        function requestUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;
                    userLatLng = [lat, lng];

                    if (map && userMarker) {
                        userMarker.setLatLng(userLatLng);
                        userMarker.addTo(map);
                    }
                }, (error) => { console.log("Location error: " + error.message); }, { enableHighAccuracy: true });
            }
        }

        window.onload = function() {
            requestUserLocation();
            loadTimetable();
        }

        function useCurrentLocation() {
            document.getElementById('singleStopInput').value = "अदालत रोड";
            findBus();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        function loadTimetable() {
            let tbody = document.getElementById('timetableBody');
            tbody.innerHTML = "";
            routesData.forEach(route => {
                tbody.innerHTML += `<tr><td><b>${route.busName[currentLang]}</b></td><td>${route.routeText[currentLang]}</td><td>${route.departureTimes}</td></tr>`;
            });
        }

        function toggleTimetable() {
            let ttCard = document.getElementById('timetableCard');
            ttCard.style.display = (ttCard.style.display === "block") ? "none" : "block";
        }

        function filterSuggestions() {
            let inputVal = document.getElementById('singleStopInput').value.trim().toLowerCase();
            let listDiv = document.getElementById('stopSuggestions');
            listDiv.innerHTML = "";
            if (inputVal === "") return;

            let matches = sambhajinagarStops.filter(s => s.toLowerCase().includes(inputVal));
            matches.forEach(itemText => {
                let item = document.createElement('div');
                item.className = 'suggestion-item';
                item.innerText = itemText;
                item.onclick = function() {
                    document.getElementById('singleStopInput').value = itemText;
                    listDiv.innerHTML = "";
                    findBus();
                };
                listDiv.appendChild(item);
            });
        }

        var map, busMarker;

        function displayBusResult(matchedBus) {
            let resultCard = document.getElementById('resultCard');
            let mapDiv = document.getElementById('map');

            resultCard.style.display = "block";
            mapDiv.style.display = "block";

            document.getElementById('busNameTitle').innerText = matchedBus.busName[currentLang];
            document.getElementById('busRouteSub').innerText = (currentLang === 'mr' ? "मार्ग: " : "Route: ") + matchedBus.routeText[currentLang];

            let etaBox = document.getElementById('etaBox');
            let currentLat = userLatLng ? userLatLng[0] : 19.8762;
            let currentLng = userLatLng ? userLatLng[1] : 75.3433;

            let dist = calculateDistance(currentLat, currentLng, matchedBus.lat, matchedBus.lng);
            let timeMin = Math.round(dist * 3);
            
            if (userLatLng) {
                etaBox.innerHTML = currentLang === 'mr' ? `📍 बस तुमच्यापासून सुमारे ${dist} किमी अंतरावर आहे (~${timeMin} मिनिटे)` : `📍 Bus is about ${dist} km away (~${timeMin} mins)`;
            } else {
                etaBox.innerHTML = currentLang === 'mr' ? `📍 संभाजीनगर मध्यभागापासून अंदाजे ${dist} किमी अंतर` : `📍 Approx ${dist} km from center`;
            }

            let crowdClass = `crowd-${matchedBus.crowd}`;
            document.getElementById('crowdStatusBox').innerHTML = `<span class="crowd-badge ${crowdClass}">📊 ${matchedBus.crowdText}</span>`;

            let timelineHTML = "";
            matchedBus.stops.forEach(stop => {
                let badge = (stop.status === "current") ? `<span class="current-badge">${currentLang === 'mr' ? 'सध्या बस इथे आहे 📍' : 'Bus is here 📍'}</span>` : "";
                timelineHTML += `
                    <div class="stop-item ${stop.status}">
                        <div class="stop-name">${stop.name[currentLang]} ${badge}</div>
                        <div class="stop-time">${stop.time}</div>
                    </div>
                `;
            });
            document.getElementById('timelineBox').innerHTML = timelineHTML;

            let standardLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' });
            let busIcon = L.divIcon({ className: 'bus-emoji-icon', html: '🚍', iconSize: [40, 40], iconAnchor: [20, 20] });

            if (!map) {
                map = L.map('map', { 
                    maxBounds: [[19.8000, 75.2500], [19.9500, 75.4500]], 
                    minZoom: 12, maxZoom: 17,
                    layers: [standardLayer] 
                }).setView([matchedBus.lat, matchedBus.lng], 15);
                
                busMarker = L.marker([matchedBus.lat, matchedBus.lng], { icon: busIcon }).addTo(map);

                let userIcon = L.divIcon({
                    className: 'custom-user-icon',
                    html: '<div class="user-dot" style="width:16px; height:16px; background:#2563eb; border:3px solid white; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,0.4);"></div>',
                    iconSize: [16, 16]
                });
                userMarker = L.marker(userLatLng || [19.8762, 75.3433], { icon: userIcon });
                if (userLatLng) userMarker.addTo(map);
            } else {
                map.setView([matchedBus.lat, matchedBus.lng], 15);
                busMarker.setLatLng([matchedBus.lat, matchedBus.lng]);
            }

            if (userLatLng && userMarker) {
                userMarker.addTo(map);
            }

            setTimeout(() => { map.invalidateSize(); }, 200);

            // Firebase Live tracking sync
            db.ref(`buses/bus_${matchedBus.id}`).on('value', (snapshot) => {
                let liveData = snapshot.val();
                if (liveData && map && busMarker) {
                    busMarker.setLatLng([liveData.lat, liveData.lng]);
                    map.panTo([liveData.lat, liveData.lng], { animate: true });
                    if (userLatLng && userMarker) userMarker.addTo(map);
                }
            });
        }

        function findBus() {
            let val = document.getElementById('singleStopInput').value.trim().toLowerCase();
            document.getElementById('stopSuggestions').innerHTML = "";

            if (!val) {
                alert(currentLang === 'mr' ? "कृपया माहिती टाका!" : "Please enter search text!");
                return;
            }

            let matchedBus = routesData.find(r => 
                r.id === val || 
                r.busName.mr.toLowerCase().includes(val) || 
                r.busName.en.toLowerCase().includes(val) || 
                r.stops.some(s => s.name.mr.toLowerCase().includes(val) || s.name.en.toLowerCase().includes(val))
            );

            if (matchedBus) {
                displayBusResult(matchedBus);
            } else {
                alert(currentLang === 'mr' ? "माफ करा, कोणतीही बस सापडली नाही." : "Sorry, no bus found.");
            }
        }
    </script>
</body>
</html>
